[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scamguard"
version = "0.1.0"
description = "Explainable scam-message screening for Urdu, Roman Urdu, and Hinglish"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "IFTIKHAR" }]
keywords = ["scam-detection", "urdu", "roman-urdu", "hinglish", "security"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Framework :: Flask",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
]
dependencies = ["Flask>=3.0,<4.0"]

[project.scripts]
scamguard = "scamguard.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
scamguard = ["templates/*.html", "static/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
